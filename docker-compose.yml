services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
      - pocketbase
      - web
    restart: unless-stopped

  pocketbase:
    build: ./infra/pocketbase
    volumes:
      - ./pb_data:/pb/pb_data
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      - PORT=3000
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      - WHOP_API_KEY=${WHOP_API_KEY:-}
      - WHOP_COMPANY_ID=${WHOP_COMPANY_ID:-}
      - WHOP_ACCESS_PASS_ID=${WHOP_ACCESS_PASS_ID:-}
      - WHOP_WEBHOOK_SECRET=${WHOP_WEBHOOK_SECRET:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://${DOMAIN:-localhost}}
    depends_on:
      - pocketbase
    restart: unless-stopped

  # Builds the static web bundle and copies it into the shared volume
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    volumes:
      - web_dist:/out
    restart: "no"

volumes:
  web_dist:
  caddy_data:
  caddy_config:
