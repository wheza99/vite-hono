services:
  pocketbase:
    build: ./infra/pocketbase
    container_name: 00-vitehono-pb
    environment:
      # Synced onto the users collection on every boot by
      # infra/pocketbase/pb_hooks/google-oauth.pb.js.
      - GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${VITE_GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./pb_data:/pb/pb_data
    restart: unless-stopped
    networks: [default]

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: 00-vitehono-server
    environment:
      - PORT=3000
      - POCKETBASE_URL=http://00-vitehono-pb:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      - WHOP_API_KEY=${WHOP_API_KEY:-}
      - WHOP_COMPANY_ID=${WHOP_COMPANY_ID:-}
      - WHOP_ACCESS_PASS_ID=${WHOP_ACCESS_PASS_ID:-}
      - WHOP_WEBHOOK_SECRET=${WHOP_WEBHOOK_SECRET:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    depends_on:
      - pocketbase
    restart: unless-stopped
    networks: [default, npm-network]

  # Web SPA — nginx baked into the image, serves dist + proxies /api and /pb
  # to the server container (see apps/web/nginx.conf).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vite bakes VITE_* into the bundle at BUILD time — they must be build
        # args, not runtime env (a static bundle never sees runtime env).
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-}
    container_name: 00-vitehono-web
    depends_on:
      - server
    restart: unless-stopped
    networks: [default, npm-network]

  # Static Astro landing — nginx on :80; NPM routes the apex domain here.
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    container_name: 00-vitehono-landing
    restart: unless-stopped
    networks: [default, npm-network]

  # Skybridge MCP app (tools + views for ChatGPT/Claude hosts) — Node 24 image.
  # NPM routes mcp.{domain} → 00-vitehono-mcp:3000 (MCP endpoint at /mcp).
  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    container_name: 00-vitehono-mcp
    environment:
      - PORT=3000
    restart: unless-stopped
    networks: [default, npm-network]

networks:
  default:
    name: vitehono_default
  npm-network:
    name: nginx-proxy-manager_default
    external: true
