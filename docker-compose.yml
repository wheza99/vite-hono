services:
  app:
    build: .
    container_name: 006-zclaw-app
    ports:
      - "3006:3000"
    environment:
      - PORT=3000
      - POCKETBASE_URL=http://006-zclaw-pb:8090
      - POCKETBASE_ADMIN_EMAIL=admin@test.com
      - POCKETBASE_ADMIN_PASSWORD=Admin123456!
      - TRIPAY_API_URL=${TRIPAY_API_URL}
      - TRIPAY_API_KEY=${TRIPAY_API_KEY}
      - TRIPAY_PRIVATE_KEY=${TRIPAY_PRIVATE_KEY}
      - TRIPAY_MERCHANT_CODE=${TRIPAY_MERCHANT_CODE}
    restart: unless-stopped
    networks:
      - default
      - npm-network

  pb:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: 006-zclaw-pb
    restart: unless-stopped
    ports:
      - "9006:8090"
    volumes:
      - ./database/pb_data:/pb_data
    networks:
      - default
      - npm-network

networks:
  default:
    name: zclaw_default
  npm-network:
    name: nginx-proxy-manager_default
    external: true
